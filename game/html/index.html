<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRICK BREAKER</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

    <header class="w-full bg-slate-900/80 backdrop-blur-md border-b border-purple-500/30 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center shadow-lg shadow-pink-500/30">
                    <span class="text-xl">🧱</span>
                </div>
                <h1 class="arcade-font text-2xl sm:text-3xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-pink-400 via-purple-300 to-cyan-400 neon-text">
                    BRICK BREAKER
                </h1>
            </div>
            <div class="flex items-center space-x-3">
                <!-- UI Mode Toggle Dropdown Settings -->
                <div class="flex items-center space-x-2 bg-slate-950/70 border border-purple-500/30 rounded-xl px-3 py-1.5">
                    <i class="fa-solid fa-sliders text-purple-400 text-xs"></i>
                    <select id="uiModeSelect" onchange="switchUiMode(this.value)" class="bg-transparent text-xs font-semibold text-purple-200 outline-none cursor-pointer">
                        <option value="grid" class="bg-slate-900 text-white">Grid View</option>
                        <option value="dropdown" class="bg-slate-900 text-white">Dropdown View</option>
                    </select>
                </div>
                <div class="text-xs font-mono text-purple-400 bg-purple-950/60 px-3 py-1.5 rounded-full border border-purple-500/30 hidden sm:block">
                    4 VERSIONS AVAILABLE
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
        <div class="text-center mb-10">
            <h2 class="arcade-font text-3xl sm:text-4xl font-extrabold text-white mb-3 tracking-wide">
                SELECT GAME VERSION
            </h2>
            <p class="text-slate-400 max-w-2xl mx-auto text-sm sm:text-base">
                Choose from 4 versions of Brick Breaker below.
            </p>
        </div>

        <!-- Grid View Layout -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="versionGrid">
        </div>

        <!-- Dropdown & Side Description View Layout -->
        <div class="hidden max-w-4xl mx-auto bg-slate-900/90 rounded-2xl border border-purple-500/30 p-6 sm:p-8 neon-card" id="dropdownView">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
                <!-- Dropdown Select Menu (Left Side) -->
                <div class="md:col-span-5 flex flex-col space-y-3">
                    <label for="versionDropdown" class="text-xs font-bold uppercase tracking-wider text-purple-300">
                        Choose Version:
                    </label>
                    <select id="versionDropdown" onchange="onVersionSelect(this.value)" class="w-full bg-slate-950 border border-purple-500/40 rounded-xl px-4 py-3 text-white font-semibold text-sm outline-none focus:border-pink-500 transition cursor-pointer">
                    </select>
                </div>

                <!-- Version Details & Play Button (Right Side) -->
                <div class="md:col-span-7 bg-slate-950/70 rounded-xl p-5 border border-slate-800/80 flex flex-col justify-between min-h-[160px]">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="arcade-font text-xl font-bold text-white" id="selectedTitle"></h3>
                            <span class="text-xs font-mono text-slate-500" id="selectedTag"></span>
                        </div>
                        <p class="text-slate-300 text-xs sm:text-sm leading-relaxed mb-6" id="selectedDescription">
                        </p>
                    </div>

                    <div>
                        <a id="selectedPlayBtn" href="#" target="_top" class="w-full py-3 px-4 rounded-xl border font-semibold text-center block transition duration-200 text-sm shadow-md">
                            PLAY NOW <i class="fa-solid fa-play ml-1.5 text-xs"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
