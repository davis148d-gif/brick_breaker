<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRICK BREAKER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0d14;
            background-image: 
                radial-gradient(at 50% 0%, rgba(124, 58, 237, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .arcade-font {
            font-family: 'Orbitron', sans-serif;
        }

        .neon-text {
            text-shadow: 
                0 0 10px rgba(236, 72, 153, 0.7),
                0 0 20px rgba(236, 72, 153, 0.5),
                0 0 30px rgba(124, 58, 237, 0.5);
        }

        .neon-card {
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .neon-card:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 0 20px rgba(168, 85, 247, 0.35),
                inset 0 0 15px rgba(168, 85, 247, 0.15);
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

    <header class="w-full bg-slate-900/80 backdrop-blur-md border-b border-purple-500/30 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center shadow-lg shadow-pink-500/30">
                    <span class="text-xl">🧱</span>
                </div>
                <h1 class="arcade-font text-2xl sm:text-3xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-pink-400 via-purple-300 to-cyan-400 neon-text">
                    BRICK BREAKER
                </h1>
            </div>
            <div class="flex items-center space-x-3">
                <!-- UI Mode Toggle Dropdown Settings -->
                <div class="flex items-center space-x-2 bg-slate-950/70 border border-purple-500/30 rounded-xl px-3 py-1.5">
                    <i class="fa-solid fa-sliders text-purple-400 text-xs"></i>
                    <select id="uiModeSelect" onchange="switchUiMode(this.value)" class="bg-transparent text-xs font-semibold text-purple-200 outline-none cursor-pointer">
                        <option value="grid" class="bg-slate-900 text-white">Grid View</option>
                        <option value="dropdown" class="bg-slate-900 text-white">Dropdown View</option>
                    </select>
                </div>
                <div id="versionCounterBadge" class="text-xs font-mono text-purple-400 bg-purple-950/60 px-3 py-1.5 rounded-full border border-purple-500/30 hidden sm:block">
                    0 VERSIONS AVAILABLE
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
        <div class="text-center mb-8">
            <h2 class="arcade-font text-3xl sm:text-4xl font-extrabold text-white mb-3 tracking-wide">
                SELECT GAME VERSION
            </h2>
            <p id="subTitleText" class="text-slate-400 max-w-2xl mx-auto text-sm sm:text-base">
                Choose a category or version of Brick Breaker below.
            </p>
        </div>

        <!-- Game Type / Category Filter Buttons -->
        <div id="gameTypeFilters" class="flex flex-wrap items-center justify-center gap-2 mb-8">
            <!-- Dynamically populated from gameTypes array -->
        </div>

        <!-- Grid View Layout -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="versionGrid">
        </div>

        <!-- Dropdown & Side Description View Layout -->
        <div class="hidden max-w-4xl mx-auto bg-slate-900/90 rounded-2xl border border-purple-500/30 p-6 sm:p-8 neon-card" id="dropdownView">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
                <!-- Dropdown Select Menu (Left Side) -->
                <div class="md:col-span-5 flex flex-col space-y-3">
                    <label for="versionDropdown" class="text-xs font-bold uppercase tracking-wider text-purple-300">
                        Choose Version:
                    </label>
                    <select id="versionDropdown" onchange="onVersionSelect(this.value)" class="w-full bg-slate-950 border border-purple-500/40 rounded-xl px-4 py-3 text-white font-semibold text-sm outline-none focus:border-pink-500 transition cursor-pointer">
                    </select>
                </div>

                <!-- Version Details & Play Button (Right Side) -->
                <div class="md:col-span-7 bg-slate-950/70 rounded-xl p-5 border border-slate-800/80 flex flex-col justify-between min-h-[160px]">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="arcade-font text-xl font-bold text-white" id="selectedTitle"></h3>
                            <span class="text-xs font-mono text-slate-500" id="selectedTag"></span>
                        </div>
                        <p class="text-slate-300 text-xs sm:text-sm leading-relaxed mb-6" id="selectedDescription">
                        </p>
                    </div>

                    <div>
                        <a id="selectedPlayBtn" href="#" target="_top" class="w-full py-3 px-4 rounded-xl border font-semibold text-center block transition duration-200 text-sm shadow-md">
                            PLAY NOW <i class="fa-solid fa-play ml-1.5 text-xs"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Set baseUrl to empty string for standard relative file navigation (e.g. v1.html, v2.html) on CodeHS
        const baseUrl = "";

        const gameTypes = [
            { id: "all", label: "All Modes", icon: "fa-border-all" },
            { id: "classic", label: "Classic", icon: "fa-gamepad" },
            { id: "multiplayer", label: "Multiplayer", icon: "fa-users" },
            { id: "upgrades", label: "Upgrades & Mechanics", icon: "fa-bolt" },
            { id: "arcade", label: "Arcade & Special Modes", icon: "fa-trophy" }
        ];

        const gameVersions = [
            {
                id: 1,
                title: "Legacy Edition",
                pageName: "v1.html",
                tag: "v1",
                tagColor: "purple",
                category: "classic",
                description: "The original version from 10/2024."
            },
            {
                id: 2,
                title: "Upgraded UI",
                pageName: "v2.html",
                tag: "v2",
                tagColor: "cyan",
                category: "classic",
                description: "Improved UI and interface as well as updated color scheme."
            },
            {
                id: 3,
                title: "Backups",
                pageName: "v3.html",
                tag: "v3",
                tagColor: "pink",
                category: "classic",
                description: "Implements save backups and dynamic state saving so you can reload and continue as well as download backup saves & track your top scores."
            },
            {
                id: 4,
                title: "Buffs",
                pageName: "v4.html",
                tag: "v4",
                tagColor: "amber",
                category: "classic",
                description: "Adds quality-of-life buffs, including double damage & fireballs"
            },
            {
                id: 5,
                title: "Permanent Upgrades",
                pageName: "v5.html",
                tag: "v5",
                tagColor: "emerald",
                category: "classic",
                description: "Adds permanent upgrades bought with Gems."
            },
            {
                id: 6,
                title: "New Bricks",
                pageName: "v6.html",
                tag: "v6",
                tagColor: "fuchsia",
                category: "classic",
                description: "Adds TNT, Loot, and Teleporting Bricks."
            },
            {
                id: 7,
                title: "Sliding Bricks",
                pageName: "v7.html",
                tag: "v7",
                tagColor: "red",
                category: "classic",
                description: "Adds a Sliding Brick."
            },
            {
                id: 8,
                title: "Difficulty Selectors",
                pageName: "v8.html",
                tag: "v8",
                tagColor: "violet",
                category: "classic",
                description: "Adds 5 different difficulty modes."
            },
            {
                id: 9,
                title: "Speedrun Mode",
                pageName: "v9.html",
                tag: "v9",
                tagColor: "orange",
                category: "classic",
                description: "Adds a Speedrun gamemode and adds a Top Speedrun Time Tracker."
            },
            {
                id: 10,
                title: "Security Patches & New Bricks",
                pageName: "v10.html",
                tag: "v10",
                tagColor: "emerald",
                category: "classic",
                description: "Adds 3 new brick types & patches a few security bugs."
            },
            {
                id: 11, 
                title: "New Bricks",
                pageName: "v11.html",
                tag: "v11",
                tagColor: "pink",
                category: "classic",
                description: "Adds 9 new interesting brick types."
            },
            {
                id: 12,
                title: "HELL",
                pageName: "v12.html",
                tag: "v12",
                tagColor: "rose",
                category: "classic",
                description: "Adds a new HELL gamemode that makes life impossible."
            }
        ];

        let activeGameType = "all";

        const colorStyles = {
            purple:  { badge: "bg-purple-500/20 text-purple-300 border-purple-500/40", btn: "bg-purple-600/30 hover:bg-purple-600 border-purple-500/50 hover:border-purple-400 text-purple-200" },
            cyan:    { badge: "bg-cyan-500/20 text-cyan-300 border-cyan-500/40", btn: "bg-cyan-600/30 hover:bg-cyan-600 border-cyan-500/50 hover:border-cyan-400 text-cyan-200" },
            pink:    { badge: "bg-pink-500/20 text-pink-300 border-pink-500/40", btn: "bg-pink-600/30 hover:bg-pink-600 border-pink-500/50 hover:border-pink-400 text-pink-200" },
            amber:   { badge: "bg-amber-500/20 text-amber-300 border-amber-500/40", btn: "bg-amber-600/30 hover:bg-amber-600 border-amber-500/50 hover:border-amber-400 text-amber-200" },
            emerald: { badge: "bg-emerald-500/20 text-emerald-300 border-emerald-500/40", btn: "bg-emerald-600/30 hover:bg-emerald-600 border-emerald-500/50 hover:border-emerald-400 text-emerald-200" },
            rose:    { badge: "bg-rose-500/20 text-rose-300 border-rose-500/40", btn: "bg-rose-600/30 hover:bg-rose-600 border-rose-500/50 hover:border-rose-400 text-rose-200" },
            indigo:  { badge: "bg-indigo-500/20 text-indigo-300 border-indigo-500/40", btn: "bg-indigo-600/30 hover:bg-indigo-600 border-indigo-500/50 hover:border-indigo-400 text-indigo-200" },
            fuchsia: { badge: "bg-fuchsia-500/20 text-fuchsia-300 border-fuchsia-500/40", btn: "bg-fuchsia-600/30 hover:bg-fuchsia-600 border-fuchsia-500/50 hover:border-fuchsia-400 text-fuchsia-200" },
            orange:  { badge: "bg-orange-500/20 text-orange-300 border-orange-500/40", btn: "bg-orange-600/30 hover:bg-orange-600 border-orange-500/50 hover:border-orange-400 text-orange-200" },
            red:     { badge: "bg-red-500/20 text-red-300 border-red-500/40", btn: "bg-red-600/30 hover:bg-red-600 border-red-500/50 hover:border-red-400 text-red-200" },
            violet:  { badge: "bg-violet-500/20 text-violet-300 border-violet-500/40", btn: "bg-violet-600/30 hover:bg-violet-600 border-violet-500/50 hover:border-violet-400 text-violet-200" }
        };

        function getFilteredVersions() {
            if (activeGameType === "all") return gameVersions;
            return gameVersions.filter(v => v.category === activeGameType);
        }

        function renderTypeFilters() {
            const container = document.getElementById('gameTypeFilters');
            container.innerHTML = gameTypes.map(type => {
                const isActive = type.id === activeGameType;
                const activeClasses = isActive 
                    ? "bg-purple-600 text-white border-purple-400 shadow-lg shadow-purple-600/30" 
                    : "bg-slate-900/80 text-slate-400 border-purple-500/20 hover:border-purple-500/50 hover:text-purple-200";

                return `
                    <button onclick="setGameType('${type.id}')" class="px-4 py-2 rounded-xl text-xs font-semibold border transition duration-200 flex items-center space-x-2 ${activeClasses}">
                        <i class="fa-solid ${type.icon}"></i>
                        <span>${type.label}</span>
                    </button>
                `;
            }).join('');
        }

        function setGameType(typeId) {
            activeGameType = typeId;
            renderTypeFilters();
            renderCards();
            setupDropdownView();
        }

        function updateHeaderBadge(count) {
            const badge = document.getElementById('versionCounterBadge');
            badge.innerText = `${count} VERSION${count === 1 ? '' : 'S'} AVAILABLE`;
        }

        function getTargetUrl(pageName) {
            if (!baseUrl) return pageName;
            return baseUrl.endsWith('/') ? `${baseUrl}${pageName}` : `${baseUrl}/${pageName}`;
        }

        function renderCards() {
            const container = document.getElementById('versionGrid');
            const filtered = getFilteredVersions();
            updateHeaderBadge(filtered.length);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-500">
                        <i class="fa-solid fa-ghost text-4xl mb-3"></i>
                        <p class="text-sm font-semibold">No versions available in this category.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(v => {
                const style = colorStyles[v.tagColor] || colorStyles.purple;
                const targetUrl = getTargetUrl(v.pageName);

                return `
                    <div class="neon-card group bg-slate-900/90 rounded-2xl border border-purple-500/30 p-5 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-xs text-slate-500 font-mono">v${v.id}.0</span>
                                <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full border ${style.badge}">
                                    ${v.category}
                                </span>
                            </div>

                            <h3 class="arcade-font text-lg font-bold text-white group-hover:text-pink-400 transition mb-3">
                                ${v.id}. ${v.title}
                            </h3>

                            <div class="bg-slate-950/60 rounded-xl p-3.5 border border-slate-800/80 mb-5">
                                <p class="text-slate-300 text-xs leading-relaxed">
                                    ${v.description}
                                </p>
                            </div>
                        </div>

                        <div>
                            <a href="${targetUrl}" target="_top" class="w-full py-2.5 px-4 rounded-xl border ${style.btn} hover:text-white font-semibold text-center block transition duration-200 text-sm shadow-md">
                                PLAY VERSION ${v.id} <i class="fa-solid fa-play ml-1.5 text-xs"></i>
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function setupDropdownView() {
            const dropdown = document.getElementById('versionDropdown');
            const filtered = getFilteredVersions();

            if (filtered.length === 0) {
                dropdown.innerHTML = `<option value="">No options</option>`;
                document.getElementById('selectedTitle').innerText = "None Available";
                document.getElementById('selectedTag').innerText = "";
                document.getElementById('selectedDescription').innerText = "No versions found under this category.";
                const btn = document.getElementById('selectedPlayBtn');
                btn.href = "#";
                btn.className = "w-full py-3 px-4 rounded-xl border bg-slate-800 border-slate-700 text-slate-500 font-semibold text-center block pointer-events-none text-sm";
                btn.innerHTML = `PLAY VERSION`;
                return;
            }

            dropdown.innerHTML = filtered.map(v => 
                `<option value="${v.id}">Version ${v.id}: ${v.title}</option>`
            ).join('');

            onVersionSelect(filtered[0].id);
        }

        function onVersionSelect(versionId) {
            const filtered = getFilteredVersions();
            const selected = filtered.find(v => v.id == versionId) || filtered[0];

            if (!selected) return;

            const style = colorStyles[selected.tagColor] || colorStyles.purple;
            const targetUrl = getTargetUrl(selected.pageName);

            document.getElementById('selectedTitle').innerText = `${selected.id}. ${selected.title}`;
            document.getElementById('selectedTag').innerText = `v${selected.id}.0`;
            document.getElementById('selectedDescription').innerText = selected.description;
            
            const btn = document.getElementById('selectedPlayBtn');
            btn.href = targetUrl;
            btn.className = `w-full py-3 px-4 rounded-xl border ${style.btn} hover:text-white font-semibold text-center block transition duration-200 text-sm shadow-md`;
            btn.innerHTML = `PLAY VERSION ${selected.id} <i class="fa-solid fa-play ml-1.5 text-xs"></i>`;
        }

        function switchUiMode(mode) {
            const gridView = document.getElementById('versionGrid');
            const dropdownView = document.getElementById('dropdownView');
            const modeSelect = document.getElementById('uiModeSelect');

            modeSelect.value = mode;

            if (mode === 'dropdown') {
                gridView.classList.add('hidden');
                dropdownView.classList.remove('hidden');
            } else {
                dropdownView.classList.add('hidden');
                gridView.classList.remove('hidden');
            }

            localStorage.setItem('brick_breaker_ui_mode', mode);
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderTypeFilters();
            renderCards();
            setupDropdownView();

            const savedMode = localStorage.getItem('brick_breaker_ui_mode') || 'grid';
            switchUiMode(savedMode);
        });
    </script>
</body>
</html>
