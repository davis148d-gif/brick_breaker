<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brick Breaker v3</title>
  <link rel="stylesheet" href="v3.css">
</head>

<body>
  <div class="main-container">
    <div class="game-section">
      <canvas id="canvas" width="710" height="880"></canvas>
      <div class="controls-row">
        <button onclick="gameManager.downBalls()">Recall Balls</button>
        <button class="btn-secondary" onclick="gameManager.exportSaveFile()">Download Save</button>
        <label class="btn-label btn-secondary">
          Upload Save
          <input type="file" id="saveFileInput" accept=".json" onchange="gameManager.importSaveFile(event)" />
        </label>
        <button class="btn-secondary" onclick="gameManager.resetGame()">New Run</button>
      </div>
    </div>

    <div class="sidebar">
      <h2>Top 100 High Scores</h2>
      <div class="leaderboard-container">
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th style="width: 50px;">Rank</th>
              <th>Score (Level)</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody">
          </tbody>
        </table>
      </div>
      <div class="leaderboard-info">Scores update to the leaderboard upon Game Over.</div>
    </div>
  </div>

  <script src="v3.js"></script>

  

  

  
</body>
</html>
